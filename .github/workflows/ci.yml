# Runs the tests on every push and pull request. It never deploys and uses no
# secrets, so it's safe in a public repo: deploying stays a manual step on your computer.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web app (ledger math + backend API)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Ledger math
        run: npm test
      - name: Backend API (builds and type-checks first)
        run: npm run test:api

  python:
    name: Python scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Commands start
        run: |
          uv run split-ledger --help > /dev/null
          uv run split-statements --help > /dev/null
      - name: Half-cent rule matches the web app
        run: |
          ledger="$RUNNER_TEMP/ledger.csv"
          uv run split-ledger --ledger "$ledger" --no-color add 1.01 me coffee > /dev/null
          uv run split-ledger --ledger "$ledger" --no-color balance | tee /dev/stderr | grep -q 'Partner owes you \$0.51'
      - name: Statement summary matches what the web app expects
        run: |
          # The web app's tests parse the same expected_summary.json, so both ends stay in step.
          uv run split-ledger --no-color summarize web/tests/fixtures/sample_split_transactions.csv -o "$RUNNER_TEMP/summary.json"
          diff "$RUNNER_TEMP/summary.json" web/tests/fixtures/expected_summary.json
