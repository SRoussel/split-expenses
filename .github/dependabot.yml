# Dependabot opens PRs to keep dependencies up to date, and CI runs on each one.
# Small updates (minor and patch) come grouped into one PR per ecosystem each month.
# Major versions get their own PR, since those are the ones that break things.
# New releases wait a week before a PR is opened, so a bad release has time to get pulled.
# Security fixes are separate: turn on "Dependabot security updates" in the repo settings.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        update-types: [minor, patch]
