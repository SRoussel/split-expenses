[project]
name = "split-expenses"
version = "0.1.0"
description = "Split bank-statement expenses with a partner and keep a running ledger"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11.10",
]

[project.scripts]
split-statements = "split_expenses.split_statements:main"
split-ledger = "split_expenses.split_ledger:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
